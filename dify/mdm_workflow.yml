app:
  description: CSV 主数据匹配工作流。后端负责上传校验、预处理、粗筛、自动实体聚类、无冲突实体写库和冲突簇保存；Dify 负责循环拉取冲突实体簇，结合知识库和大模型完成实体分组后写入数据库。
  icon: "\U0001F5C3"
  icon_background: "#E0F2FE"
  mode: workflow
  name: MDM CSV 黄金记录匹配
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables:
    - description: 外部 MDM 匹配 API 的基础地址。
      id: env_mdm_api_base
      name: MDM_API_BASE
      selector:
        - env
        - MDM_API_BASE
      value: http://host.docker.internal:8000
      value_type: string
  features:
    file_upload:
      allowed_file_extensions:
        - .csv
      allowed_file_types:
        - document
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 100
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 3
    opening_statement: ""
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: http-request
        id: start-to-strict-schema
        source: start
        sourceHandle: source
        target: strict_schema_match
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: if-else
        id: strict-schema-to-branch
        source: strict_schema_match
        sourceHandle: source
        target: strict_schema_branch
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: http-request
        id: strict-schema-hit-to-ingest
        source: strict_schema_branch
        sourceHandle: exact_schema_matched
        target: ingest_and_match
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: http-request
        id: strict-schema-bypass-to-ingest
        source: strict_schema_branch
        sourceHandle: strict_schema_bypass
        target: ingest_and_match
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: llm
        id: strict-schema-miss-to-analyze
        source: strict_schema_branch
        sourceHandle: "false"
        target: analyze_schema
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: if-else
        id: analyze-schema-to-branch
        source: analyze_schema
        sourceHandle: source
        target: analyze_schema_branch
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: http-request
        id: analyze-schema-related-to-ingest
        source: analyze_schema_branch
        sourceHandle: schema_related
        target: ingest_and_match
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: end
        id: analyze-schema-mismatch-to-end
        source: analyze_schema_branch
        sourceHandle: "false"
        target: schema_gate_mismatch_end
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
