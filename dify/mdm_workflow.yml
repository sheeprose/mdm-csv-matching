      - data:
          code: |-
            import json

            def main(commit_body: str) -> dict:
                try:
                    payload = json.loads(commit_body) if isinstance(commit_body, str) else (commit_body or {})
                except Exception:
                    payload = {}
                return {
                    "next_offset": int(payload.get("next_offset") or 0),
                    "has_more": bool(payload.get("has_more", False)),
                    "committed_count": int(payload.get("committed_count") or 0),
                }
          code_language: python3
