          desc: 循环拉取冲突实体簇批次。每轮处理 30 个簇，减少大模型调用次数；后端会避免重复返回候选内容，直到 /commit-llm-batch 返回 has_more=false。
          error_handle_mode: terminated
          height: 330
          logical_operator: and
          loop_count: 100
          loop_variables:
            - id: loop-variable-offset
              label: offset
              value: "0"
              value_type: constant
              var_type: number
            - id: loop-variable-has-more
              label: has_more
              value: true
              value_type: constant
              var_type: boolean
          selected: false
          start_node_id: llm_batch_loop_start
          title: 循环处理冲突实体簇
          type: loop
          width: 1960
        height: 330
        id: llm_batch_loop
        position:
          x: 980
          y: 140
        positionAbsolute:
          x: 980
          y: 140
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 1960
        zIndex: 1
      - data:
          desc: ""
          isInLoop: true
          selected: false
          title: ""
          type: loop-start
        draggable: false
        height: 48
        id: llm_batch_loop_start
        parentId: llm_batch_loop
        position:
          x: 60
          y: 140
        positionAbsolute:
          x: 1040
          y: 280
        selectable: false
        sourcePosition: right
        targetPosition: left
        type: custom-loop-start
        width: 44
        zIndex: 1002
      - data:
          authorization:
            config: null
            type: no-auth
          body:
            data:
              - id: json-body-get-llm-batch
