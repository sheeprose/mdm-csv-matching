        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: true
          loop_id: llm_batch_loop
          sourceType: loop-start
          targetType: http-request
        id: loop-start-to-candidate-batch
        source: llm_batch_loop_start
        sourceHandle: source
        target: get_llm_batch
        targetHandle: target
        type: custom
        zIndex: 1002
      - data:
          isInIteration: false
          isInLoop: true
          loop_id: llm_batch_loop
          sourceType: http-request
          targetType: knowledge-retrieval
        id: candidate-batch-to-knowledge
        source: get_llm_batch
        sourceHandle: source
        target: retrieve_mdm_knowledge
        targetHandle: target
        type: custom
        zIndex: 1002
      - data:
          isInIteration: false
          isInLoop: true
          loop_id: llm_batch_loop
          sourceType: knowledge-retrieval
          targetType: llm
        id: knowledge-to-llm
        source: retrieve_mdm_knowledge
        sourceHandle: source
        target: llm_batch_review
        targetHandle: target
        type: custom
        zIndex: 1002
      - data:
          isInIteration: false
          isInLoop: true
          loop_id: llm_batch_loop
          sourceType: llm
          targetType: code
        id: llm-to-prepare-result
        source: llm_batch_review
        sourceHandle: source
        target: prepare_llm_result
        targetHandle: target
        type: custom
        zIndex: 1002
      - data:
          isInIteration: false
          isInLoop: true
          loop_id: llm_batch_loop
          sourceType: code
          targetType: http-request
        id: prepare-result-to-commit
        source: prepare_llm_result
        sourceHandle: source
        target: commit_llm_batch
        targetHandle: target
        type: custom
        zIndex: 1002
      - data:
          isInIteration: false
          isInLoop: true
          loop_id: llm_batch_loop
          sourceType: http-request
          targetType: code
        id: commit-to-parse-state
        source: commit_llm_batch
        sourceHandle: source
        target: parse_loop_state
        targetHandle: target
        type: custom
        zIndex: 1002
      - data:
          isInIteration: false
          isInLoop: true
          loop_id: llm_batch_loop
          sourceType: code
          targetType: assigner
        id: parse-state-to-assign
        source: parse_loop_state
        sourceHandle: source
        target: update_loop_state
        targetHandle: target
        type: custom
        zIndex: 1002
    nodes:
      - data:
          desc: 主数据库为空时上传 tableA 和 tableB；主数据库已有数据时只上传 incoming_csv。匹配阈值由后端模型配置统一控制，冲突簇会交给大模型分组。
          selected: false
          title: 开始
          type: start
          variables:
            - label: tableA CSV 本地路径或 URL
              max_length: 512
              options: []
              required: false
              type: text-input
              variable: table_a_path
            - label: tableB CSV 本地路径或 URL
              max_length: 512
              options: []
              required: false
              type: text-input
              variable: table_b_path
            - label: 待匹配 CSV 本地路径或 URL
              max_length: 512
              options: []
              required: false
              type: text-input
              variable: incoming_csv_path
        height: 126
        id: start
        position:
          x: 80
          y: 280
        positionAbsolute:
          x: 80
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            config: null
            type: no-auth
          body:
            data:
              - id: json-body-strict-schema-match
                type: text
                value: |-
                  {
                    "table_a_path": "{{#start.table_a_path#}}",
                    "table_b_path": "{{#start.table_b_path#}}",
                    "incoming_csv_path": "{{#start.incoming_csv_path#}}"
                  }
            type: json
          desc: Strictly compare Table A and Table B column headers. Same order, same characters, same case means schema matched and can skip LLM schema judgment.
          headers: Content-Type:application/json
          method: post
          params: ""
          selected: false
          timeout:
            connect: 10
            max_connect_timeout: 0
            max_read_timeout: 0
            max_write_timeout: 0
            read: 60
            write: 20
          title: 严格列标题命中
          type: http-request
          url: "{{#env.MDM_API_BASE#}}/strict-schema-match"
        height: 126
        id: strict_schema_match
        position:
          x: 380
          y: 280
        positionAbsolute:
          x: 380
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: exact_schema_matched
              conditions:
                - comparison_operator: contains
                  id: exact-schema-condition
                  value: strict_schema_matched
                  varType: string
                  variable_selector:
                    - strict_schema_match
                    - body
              id: exact_schema_matched
              logical_operator: and
            - case_id: strict_schema_bypass
              conditions:
                - comparison_operator: contains
                  id: strict-schema-bypass-condition
                  value: strict_schema_bypass
                  varType: string
                  variable_selector:
                    - strict_schema_match
                    - body
              id: strict_schema_bypass
              logical_operator: and
          desc: Exact column schema match goes directly to ingestion. Missed strict match goes to schema analysis.
          selected: false
          title: 是否严格命中
          type: if-else
        height: 152
        id: strict_schema_branch
        position:
          x: 680
          y: 280
        positionAbsolute:
          x: 680
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: Strict schema match failed. Ask the LLM to judge whether the two CSV schemas still describe the same entity type before continuing to ingestion.
          model:
            completion_params:
              max_tokens: 2048
              temperature: 0
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: system-prompt
              role: system
              text: |-
                You are a strict schema gatekeeper for an MDM/entity matching workflow. Dify structured output is enabled. Return only the structured fields. Decide whether Table A and Table B describe the same kind of real-world entity. Be conservative: if the domains differ, or if no comparable name/title field exists, set related=false.
            - id: user-prompt
              role: user
              text: |-
                The exact column-header match failed, so you must judge schema compatibility semantically before the workflow can continue.

                Strict match result from backend:
                {{#strict_schema_match.body#}}

                Rules:
                1. related=true only when both tables describe the same entity type and have comparable primary identity fields such as title, name, product_name, restaurant name, publication title, phone, address, brand, manufacturer, author, venue, year, or price.
                2. related=false when one table is products/software and the other is publications, restaurants, people, organizations, or another different domain.
                3. Identifier-only overlap such as id, uuid, row_id, source, class, label, or internal keys is not enough.
                4. If the schemas are compatible but column names differ, provide column_mapping from Table A fields to Table B fields.
                5. Keep confidence between 0 and 1. Use confidence below 0.75 for weak or ambiguous schema evidence.
                6. Do not inspect or assume row values. Use only the provided columns and reason text.
                7. Treat Beer_Name, Brew_Factory_Name, Style, and ABV as beer-domain columns. They are not product/software columns.
                8. Treat addr, city, phone, type, and class together as restaurant/location-domain columns. They are not product/software columns and not beer-domain columns unless explicit beer fields also exist.
                9. Treat title, manufacturer, and price together as product/software-commerce columns unless stronger domain-specific columns prove otherwise.
                10. Cross-domain pairs such as product/software vs beer, product/software vs restaurant, or beer vs restaurant must return related=false even when both tables have id or title-like fields.
          reasoning_format: separated
          retry_config:
            enabled: true
            exponential_backoff:
              enabled: true
              max_interval: 10000
              multiplier: 2
            max_retries: 2
            retry_interval: 1000
          selected: false
          structured_output:
            schema:
              additionalProperties: false
              properties:
                blocking_columns:
                  description: Columns suitable for candidate blocking, such as title/name plus brand, author, phone, address, or year.
                  items:
                    type: string
                  type: array
                column_mapping:
                  additionalProperties:
                    type: string
                  description: Mapping from Table A columns to semantically equivalent Table B columns.
                  type: object
                confidence:
                  description: Confidence in the schema compatibility judgment, from 0 to 1.
                  type: number
                entity_type:
                  description: The shared entity type when related=true, otherwise the most likely mismatch summary.
                  type: string
                ignored_columns:
                  description: Identifier, label, source, or internal columns ignored for entity matching.
                  items:
                    type: string
                  type: array
                reason:
                  description: Brief reason for the compatibility decision.
                  type: string
                related:
                  description: Whether the two tables describe the same entity type and can continue to matching.
                  type: boolean
                relation_type:
                  description: same_entity_table when compatible, dataset_type_mismatch when incompatible, uncertain_schema when evidence is weak.
                  enum:
                    - same_entity_table
                    - dataset_type_mismatch
                    - uncertain_schema
                  type: string
              required:
                - related
                - relation_type
                - entity_type
                - confidence
                - reason
                - column_mapping
                - ignored_columns
                - blocking_columns
              type: object
          structured_output_enabled: true
          title: LLM Schema 判别
          type: llm
          variables: []
          vision:
            enabled: false
        height: 126
        id: analyze_schema
        position:
          x: 980
          y: 460
        positionAbsolute:
          x: 980
          y: 460
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: schema_related
              conditions:
                - comparison_operator: is
                  id: schema-related-condition
                  value: true
                  varType: boolean
                  variable_selector:
                    - analyze_schema
                    - structured_output
                    - related
              id: schema_related
              logical_operator: and
          desc: LLM-compatible schemas continue to ingestion. LLM schema mismatch ends early.
          selected: false
          title: Schema 是否通过
          type: if-else
        height: 152
        id: analyze_schema_branch
        position:
          x: 1280
          y: 460
        positionAbsolute:
          x: 1280
          y: 460
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json

            def main(match_run_id: str, offset: int, clusters, current_batch_body: str) -> dict:
                if isinstance(clusters, str):
                    try:
                        clusters = json.loads(clusters)
                    except Exception:
                        clusters = []
                if not isinstance(clusters, list):
                    clusters = []

                try:
                    current_batch = json.loads(current_batch_body) if isinstance(current_batch_body, str) else (current_batch_body or {})
                except Exception:
                    current_batch = {}
                current_clusters = current_batch.get("clusters") if isinstance(current_batch, dict) else []
                if not isinstance(current_clusters, list):
                    current_clusters = []

                result_by_id = {}
                for cluster in clusters:
                    if isinstance(cluster, dict):
                        cluster_id = str(cluster.get("cluster_id") or "")
                        if cluster_id:
                            result_by_id[cluster_id] = cluster
                current_cluster_ids = [
                    str(cluster.get("cluster_id") or "")
                    for cluster in current_clusters
                    if isinstance(cluster, dict) and str(cluster.get("cluster_id") or "")
                ]
                filtered_clusters = [
                    result_by_id[cluster_id]
                    for cluster_id in current_cluster_ids
                    if cluster_id in result_by_id
                ]
                llm_result = {
                    "clusters": filtered_clusters
                }
                body = {
                    "match_run_id": match_run_id or "",
                    "offset": int(offset or 0),
                    "limit": 30,
                    "llm_result": llm_result,
                    "source": "llm",
                    "reason": "Dify 循环中的知识库大模型实体分组",
                }
                return {
                    "commit_body_json": json.dumps(body, ensure_ascii=False)
                }
          code_language: python3
          desc: 生成完整的 /commit-llm-batch 请求体，提交当前冲突簇批次的大模型实体分组结果。
          isInIteration: false
          isInLoop: true
          loop_id: llm_batch_loop
          outputs:
            commit_body_json:
              children: null
              type: string
          selected: false
          title: 生成提交请求体
          type: code
          variables:
            - value_selector:
                - ingest_and_match
                - body
                - match_run_id
              value_type: string
              variable: match_run_id
            - value_selector:
                - llm_batch_loop
                - offset
              value_type: number
              variable: offset
            - value_selector:
                - llm_batch_review
                - structured_output
                - clusters
              value_type: array[object]
              variable: clusters
            - value_selector:
                - get_llm_batch
                - body
              value_type: string
              variable: current_batch_body
        height: 126
        id: prepare_llm_result
        parentId: llm_batch_loop
        position:
          x: 1050
          y: 100
        positionAbsolute:
          x: 2030
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        zIndex: 1002
      - data:
          authorization:
            config: null
            type: no-auth
          body:
            data:
              - id: json-body-ingest-and-match
                type: text
                value: |-
                  {
                    "table_a_path": "{{#start.table_a_path#}}",
                    "table_b_path": "{{#start.table_b_path#}}",
                    "incoming_csv_path": "{{#start.incoming_csv_path#}}"
                  }
            type: json
          desc: 后端完成上传校验、CSV 加载、预处理、粗筛、自动实体聚类、无冲突实体写库，并保存需要大模型判定的冲突实体簇。
          headers: Content-Type:application/json
          method: post
          params: ""
          selected: false
          timeout:
            connect: 10
            max_connect_timeout: 0
            max_read_timeout: 0
            max_write_timeout: 0
            read: 600
            write: 60
          title: 摄入并匹配
          type: http-request
          url: "{{#env.MDM_API_BASE#}}/ingest-and-match"
        height: 126
        id: ingest_and_match
        position:
          x: 380
          y: 280
        positionAbsolute:
          x: 380
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: schema_mismatch
              conditions:
                - comparison_operator: contains
                  id: schema-mismatch-status-condition
                  value: schema_mismatch
                  varType: string
                  variable_selector:
                    - ingest_and_match
                    - body
              id: schema_mismatch
              logical_operator: and
            - case_id: reupload_required
              conditions:
                - comparison_operator: contains
                  id: reupload-required-status-condition
                  value: reupload_required
                  varType: string
                  variable_selector:
                    - ingest_and_match
                    - body
              id: reupload_required
              logical_operator: and
            - case_id: llm_required
              conditions:
                - comparison_operator: contains
                  id: llm-status-condition
                  value: llm_required
                  varType: string
                  variable_selector:
                    - ingest_and_match
                    - body
              id: llm_required
              logical_operator: and
          desc: 只有摄入结果包含冲突实体簇时，才进入 Dify Loop 循环处理；没有冲突簇、需要重传或全部已自动处理时直接结束。
          selected: false
          title: 是否需要冲突簇循环
          type: if-else
        height: 152
        id: need_llm_branch
        position:
          x: 680
          y: 280
        positionAbsolute:
          x: 680
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          break_conditions:
            - comparison_operator: is
              id: loop-break-when-no-more
              value: false
              varType: boolean
              variable_selector:
