app:
  description: 单批高置信候选审核子工作流。由本地 MDM API 调用，用 Dify 知识库检索辅助大模型选择主标题。
  icon: "\U0001F50E"
  icon_background: "#E0F2FE"
  mode: workflow
  name: MDM 高置信候选知识库审核
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: knowledge-retrieval
        id: start-to-knowledge
        source: start
        sourceHandle: source
        target: knowledge_retrieval
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: knowledge-retrieval
          targetType: llm
        id: knowledge-to-llm
        source: knowledge_retrieval
        sourceHandle: source
        target: choose_titles
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: llm-to-end
        source: choose_titles
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: API 会传入一批高置信候选 JSON，以及用于检索知识库的查询文本。
          selected: false
          title: 开始
          type: start
          variables:
            - label: 候选批次 JSON
              max_length: 200000
              options: []
              required: true
              type: paragraph
              variable: candidate_batch_json
            - label: 知识库检索问题
              max_length: 2000
              options: []
              required: true
              type: text-input
              variable: knowledge_query
        height: 116
        id: start
        position:
          x: 80
          y: 240
        positionAbsolute:
          x: 80
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          dataset_ids:
            - 00000000-0000-0000-0000-000000000000
          desc: 检索品牌别名、制造商归一化规则、历史匹配样例和标题选择规则。
          query_variable_selector:
            - start
            - knowledge_query
          retrieval_mode: single
          selected: false
          single_retrieval_config:
            model:
              completion_params: {}
              mode: chat
              name: deepseek-chat
              provider: deepseek
          title: 检索主数据知识库
          type: knowledge-retrieval
        height: 92
        id: knowledge_retrieval
        position:
          x: 380
          y: 240
        positionAbsolute:
          x: 380
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: true
            variable_selector:
              - knowledge_retrieval
              - result
          desc: 对本批 candidates 逐条选择主标题，输出严格 JSON。
          model:
            completion_params:
              temperature: 0.1
            mode: chat
            name: deepseek-chat
            provider: deepseek
          prompt_template:
            - id: system-prompt
              role: system
              text: 你是主数据匹配审核员。你必须结合知识库内容和候选字段做判断。只允许处理输入 JSON 中 candidates 数组里的候选。每条候选都必须输出一条记录。chosen_title 只能从 table1.title 或 table2.title 中选择一个，优先选择更完整、品牌和版本信息更明确、歧义更少的标题。只返回合法 JSON，不要解释，不要 Markdown。
            - id: user-prompt
              role: user
              text: "知识库检索结果：\n{{#context#}}\n\n候选批次 JSON：\n{{#start.candidate_batch_json#}}\n\n请返回严格 JSON，格式必须是：\n{\"records\":[{\"chosen_title\":\"...\",\"chosen_record\":{...候选原文...},\"confidence\":0.95,\"reason\":\"...\"}]}"
          selected: false
          title: 大模型选择主标题
          type: llm
          variables: []
          vision:
            enabled: false
        height: 126
        id: choose_titles
        position:
          x: 680
          y: 240
        positionAbsolute:
          x: 680
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 返回 records JSON 给 MDM API，由 API 负责写入 MySQL 或 SQLite。
          outputs:
            - value_selector:
                - choose_titles
                - text
              variable: result
          selected: false
          title: 结束
          type: end
        height: 90
        id: end
        position:
          x: 980
          y: 240
        positionAbsolute:
          x: 980
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
